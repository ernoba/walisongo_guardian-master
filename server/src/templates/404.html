<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tidak Ditemukan</title>
  <style>
    /* GitHub Light Mode Color Palette */
    :root {
      --bg: #ffffff;
      --text-main: #1f2328;
      --text-muted: #636c76;
      --btn-bg: #1f883d;
      --btn-hover: #1a7f37;
      --border: #d0d7de;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-wrapper {
      text-align: center;
      padding: 20px;
      max-width: 520px;
      width: 100%;
    }

    /* Container Logo dengan Efek Mengambang Halus (Floating) */
    .logo-container {
      margin-bottom: 24px;
      animation: float 4s ease-in-out infinite;
    }

    .github-octocat {
      fill: var(--text-main);
      opacity: 0.9;
    }

    .error-code {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .error-message {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Garis pembatas tipis khas GitHub Light */
    .divider {
      height: 1px;
      background-color: var(--border);
      width: 100%;
      margin-bottom: 32px;
    }

    /* Tombol Hijau Khas GitHub Light */
    .btn-github {
      display: inline-flex;
      align-items: center;
      background-color: var(--btn-bg);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid rgba(31, 35, 40, 0.1);
      box-shadow: 0 1px 0 rgba(27, 31, 36, 0.1);
      transition: background-color 0.15s cubic-bezier(0.3, 0, 0.5, 1);
      cursor: pointer;
    }

    .btn-github:hover {
      background-color: var(--btn-hover);
    }

    .btn-github:active {
      background-color: var(--btn-bg);
    }

    /* Animasi Mengambang */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
